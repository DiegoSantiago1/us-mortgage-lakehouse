# Publica a pasta site/ no GitHub Pages a cada push na main.
# A página é estática: lê site/dados/resultados.json, gerado por `python -m hmda.exportar_site`
# (o GitHub não tem os 222 mi de linhas; o JSON agregado é versionado junto).
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # Ativa o GitHub Pages (fonte: GitHub Actions) no primeiro deploy, se ainda
          # não estiver ativo em Settings -> Pages.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

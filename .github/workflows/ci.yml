# Testes e lint dentro da MESMA imagem Docker usada localmente (D15):
# Python 3.13 + Java 21 + PySpark 4.2 + Delta 4.4. Os testes não baixam nada:
# usam arquivos pequenos montados à mão no formato do FFIEC (tests/fabrica.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem
        run: docker build -t us-mortgage-lakehouse:ci .
      - name: Lint (ruff)
        run: docker run --rm us-mortgage-lakehouse:ci sh -c "ruff check src tests && ruff format --check src tests"
      - name: Testes (pytest com Spark + Delta)
        run: docker run --rm -e HMDA_DADOS=/tmp/dados -e HMDA_LAKE=/tmp/lake us-mortgage-lakehouse:ci pytest -q -p no:cacheprovider
      - name: Página (sintaxe do JavaScript)
        run: |
          node --check site/app.js
          node --check site/i18n.js
          python3 -c "import json; d = json.load(open('site/dados/resultados.json')); assert d['qualidade'], 'sem checagens'; print('resultados.json ok')"
